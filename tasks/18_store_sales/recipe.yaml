# ML-Fathom の「前処理と書き出し」で作って保存したレシピ (学習できる形にする手順を作る. 店ごとにずらす)
format_version: 1
target: sales
task: forecasting
steps:
- op: drop_duplicates
- op: normalize_text
  columns:
  - store
- op: lag
  columns: auto
  lags:
  - 1
  - 7
  windows:
  - 7
  by:
  - store
- op: drop_missing
- op: datetime_parts
  columns:
  - date
  parts:
  - weekday
  - month
  drop: false
- op: one_hot
  columns:
  - store
- op: standardize
  columns: auto
split:
  method: time
  valid: 0.15
  test: 0.15
  seed: 0
item_steps: []
