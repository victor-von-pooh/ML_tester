# ML-EDA の前処理のレシピ (ML-Fathom の「前処理と書き出し」で作るものと同じ形)
format_version: 1
target: label
task: classification
steps:
  # 読めない画像 (大きさが欠損) を除く
  - {op: filter_rows, column: width, compare: notna}
item_steps:
  # 灰色とカラーを 3 チャンネルにそろえ, 大きさを 32x32 に, 学習用の平均と標準偏差で正規化
  - {op: rgb}
  - {op: resize, width: 32, height: 32}
  - {op: normalize}
split: {method: stratified, valid: 0.2, test: 0.1, seed: 0}
