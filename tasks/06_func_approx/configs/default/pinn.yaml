# train_pinn.py 用の config (train.py の config とは別)
# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: pinn
  seed: 42
  # 小さな MLP なので cpu の方が速い (01 で確認)
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.001

trainer:
  epochs: 3000
  progress_bar: false
  # 保存が学習時間の大部分を占めるので止める (このタスクの実験 1 で確認)
  checkpoint:
    save_best: false
    save_last: false

# プロジェクト固有の設定
data:
  n_train: 200
  n_valid: 101

model:
  hidden_dim: 32
  n_layers: 3

pinn:
  # 検証時にも勾配の計算を有効にするかどうか
  force_grad: false
