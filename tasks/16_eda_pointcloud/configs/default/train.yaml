# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: objects
  seed: 0
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.003

trainer:
  epochs: 40
  monitor: valid/acc
  mode: max
  early_stopping:
    use: true
    patience: 8

# プロジェクト固有の設定
data:
  # prepare.py が ML-EDA で書き出すデータセット (タスクのディレクトリから)
  dataset: outputs/dataset
  batch_size: 64

model:
  channels: 32
