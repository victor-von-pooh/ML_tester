# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: mnist_ae
  seed: 42

optimizer:
  name: Adam
  params:
    lr: 0.001

trainer:
  epochs: 30

# プロジェクト固有の設定
data:
  # 相対パスはタスクのディレクトリから辿る
  root: ../../data/torchvision
  valid_size: 6000
  batch_size: 128
  num_workers: 2

model:
  latent_dim: 16

visualize:
  # 再構成画像に使う検証用の画像の枚数と, 保存するエポックの間隔
  n_images: 16
  every_n_epochs: 5
