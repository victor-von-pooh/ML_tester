# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: tokyo_temp
  seed: 42
  # 小さな LSTM なので cpu で学習
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.001

# 再開して 60 エポックまで学習するため, T_max は epochs より大きくする
scheduler:
  name: CosineAnnealingLR
  params:
    T_max: 60

trainer:
  epochs: 30
  grad_clip_norm: 1.0

# プロジェクト固有の設定
data:
  # prepare_data.py で整形した日別値, 相対パスはタスクのディレクトリから辿る
  path: ../../data/jma/tokyo_daily.csv
  # 予測する日がこの日以降の組を検証用にする
  valid_from: "2026-07-01"
  # 入力に使う過去の日数
  input_days: 14
  batch_size: 32

model:
  # torch は nn.LSTM, oddnn は OddNN の自作 LSTM
  lstm_type: torch
  hidden_dim: 64
  num_layers: 2
