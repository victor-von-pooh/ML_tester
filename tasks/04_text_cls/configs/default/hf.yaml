# train_hf.py 用の config (train.py の config とは別)
# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: arxiv_hf
  seed: 42

optimizer:
  name: AdamW
  params:
    lr: 0.00002
    weight_decay: 0.01

# Scheduler は train_hf.py で transformers の関数から作って Trainer に渡すので
# name は null のまま, 更新の間隔だけを指定
scheduler:
  interval: step

trainer:
  epochs: 2
  monitor: valid/macro_f1
  mode: max

# プロジェクト固有の設定
# warmup に使うステップの割合
warmup_ratio: 0.1

data:
  # 相対パスはタスクのディレクトリから辿る
  path: ../../data/arxiv/arXiv.csv
  valid_from: "2507"
  # 事前学習済みモデルは重いので, 学習用と検証用から取り出す件数
  n_train: 20000
  n_valid: 5000
  max_len: 256
  batch_size: 32

model:
  # Hugging Face の事前学習済みモデルの名前 (Apache 2.0)
  name: distilbert-base-uncased
