# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: iris
  seed: 42

optimizer:
  name: Adam
  params:
    lr: 0.01

trainer:
  epochs: 200
  # 正解率は大きい方が良いので max に設定
  monitor: valid/acc
  mode: max
  early_stopping:
    use: true
    patience: 20

# プロジェクト固有の設定
data:
  valid_size: 0.2
  batch_size: 16

model:
  hidden_dim: 16
