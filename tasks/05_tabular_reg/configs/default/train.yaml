# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: california
  seed: 42
  # 小さな MLP なので cpu の方が速い (01 で確認)
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.001

# 検証用データの損失が改善しなくなったら学習率を半分に
# mode は省略すると trainer.mode (min) に合わせられる
scheduler:
  name: ReduceLROnPlateau
  params:
    factor: 0.5
    patience: 5

trainer:
  epochs: 200
  early_stopping:
    use: true
    patience: 20

# プロジェクト固有の設定
data:
  # 相対パスはタスクのディレクトリから辿る
  root: ../../data/sklearn
  valid_size: 0.2
  batch_size: 128

model:
  hidden_dim: 128
