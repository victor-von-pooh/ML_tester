experiment:
  name: ja_bert_natural_subword

data:
  dataset: outputs/dataset_natural_subword
  corpus: outputs/corpus_natural_subword.npy

model:
  spec: models/ja_bert_natural_subword.yaml
  init: outputs/pretrained_natural_subword.pt
