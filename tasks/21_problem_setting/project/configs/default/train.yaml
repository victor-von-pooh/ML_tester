# ML-Found が使う設定 (ML-Quest が問題から書き出した骨組み)
# 学習に要る機能 (ML-Found の登録簿の名前). 学習の前に確かめ, 足りなければ
# 入れ方を示して止まる
requires: [eda, modelcontrol, inference]

experiment:
  name: "sales_forecasting"
  seed: 0

optimizer:
  name: Adam
  params:
    lr: 0.001

trainer:
  epochs: 50
  # 問題の「学習で見る指標」
  monitor: valid/mae
  mode: min
  early_stopping:
    use: true
    patience: 10

# プロジェクト固有の設定
data:
  # データの分析の段階 (ML-EDA) で書き出すデータセット (プロジェクトのディレクトリから)
  dataset: outputs/dataset
  batch_size: 64

model:
  # ML-ModelControl の形のモデルの定義 (モデルの作成・選定の段階で組む)
  spec: models/model.yaml
