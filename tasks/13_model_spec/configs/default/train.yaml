# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: digits_spec
  seed: 0
  # 小さなモデルなので, GPU より CPU の方が速い
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.003

trainer:
  epochs: 30
  monitor: valid/acc
  mode: max
  early_stopping:
    use: true
    patience: 5

# プロジェクト固有の設定
data:
  valid_size: 0.2
  batch_size: 64

model:
  # ML-ModelControl のモデルの定義 (タスクのディレクトリからの相対パス)
  spec: models/cnn.yaml
