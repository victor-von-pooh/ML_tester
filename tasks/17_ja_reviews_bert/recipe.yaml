# ML-Fathom の「前処理と書き出し」で作って保存したレシピ (読み方は「文 (review)」)
format_version: 1
target: label
task: classification
steps:
- op: drop_duplicates
  columns:
  - review
- op: filter_rows
  column: length
  compare: '>'
  value: 0
split:
  method: stratified
  valid: 0.2
  test: 0.1
  seed: 0
item_steps:
- op: vocabulary
  length: 78
  max_tokens: 20000
  unit: char
