# ML-Found が使う設定, 書かなかった項目は ML-Found の既定値
experiment:
  name: churn
  seed: 0
  # 小さなモデルなので, GPU より CPU の方が速い
  device: cpu

optimizer:
  name: Adam
  params:
    lr: 0.003

trainer:
  epochs: 60
  monitor: valid/acc
  mode: max
  early_stopping:
    use: true
    patience: 10

# プロジェクト固有の設定
data:
  # prepare.py が ML-EDA で書き出すデータセット (タスクのディレクトリから)
  dataset: outputs/dataset
  batch_size: 64

model:
  hidden_dim: 32
